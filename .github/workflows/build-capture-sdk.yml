name: Build Capture SDK

on:
  push:
    branches:
      - master
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:

jobs:
  build-and-pack:
    name: Build & Pack SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm pack)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build Capture SDK
        run: bun run build --filter=@crikket-io/capture

      - name: Pack Capture SDK
        id: pack
        run: |
          cd sdks/capture
          npm pack
          # Recupera o nome exato do arquivo gerado
          TARBALL_NAME=$(ls crikket-io-capture-*.tgz)
          echo "tarball=$TARBALL_NAME" >> $GITHUB_OUTPUT
          echo "Gerado: $TARBALL_NAME"

      - name: Upload SDK Tarball
        uses: actions/upload-artifact@v4
        with:
          name: crikket-capture-sdk
          path: sdks/capture/${{ steps.pack.outputs.tarball }}
          retention-days: 7
